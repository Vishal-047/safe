name: SafeLane PR Gate
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  safelane_analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Trigger SafeLane Orchestrator
        env:
          EVENT_PAYLOAD: ${{ toJson(github.event) }}
        run: |
          printf '%s' "$EVENT_PAYLOAD" | curl -X POST "https://safelane-orchestrator-fdr3.onrender.com/webhook/pr" -H "Content-Type: application/json" -H "X-GitHub-Event: pull_request" --data-binary @- --fail-with-body
